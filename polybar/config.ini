[colors]
background = #00000000
background-alt = #1a1a1a
foreground = #ffffff
primary = #ffffff
secondary = #ffffff
alert = #ffffff
disabled = #666666
accent = #ffffff
module-bg = #1a1a1a

[bar/example]
width = 100%
height = 20
radius = 0
fixed-center = true
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0pt
border-size = 0pt

padding-left = 0
padding-right = 0

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=9;3"
font-1 = "JetBrainsMono Nerd Font:size=14;4"
font-2 = "JetBrainsMono Nerd Font:size=10;3"

modules-left = rofi file screen date cale r systray
modules-center = l bspwm r
modules-right = l eth disk pulseaudio cpu memory battery powermenu

cursor-click = pointer
enable-ipc = true

;==========================================================
;   Rounding Caps Pills Style
;==========================================================

[module/l]
type = custom/text
content = " "
content-foreground = ${colors.module-bg}
content-font = 2

[module/r]
type = custom/text
content = " "
content-foreground = ${colors.module-bg}
content-font = 2

[module/sep]
type = custom/text
; Reduced space to a single space
content = " "
content-background = ${colors.background}

#------------------------------
# MODULES
#------------------------------

[module/disk]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true

format-mounted = <label-mounted>
format-mounted-background = ${colors.module-bg}
format-mounted-prefix = " 󰋊 "
format-mounted-prefix-foreground = ${colors.rosewater}

label-mounted = "%percentage_used%% "

; Shown when the drive isn't found
label-unmounted = " 󱁌 %mountpoint% "
label-unmounted-background = ${colors.module-bg}
label-unmounted-foreground = #6c7086

[module/systray]
type = internal/tray
format-margin = 2pt
tray-spacing = 1pt
# tray-size = 16pt
tray-background = ${colors.background}

[module/rofi]
type = custom/text
; Updated to Arch Linux logo
content = " 󰣇 "
content-background = ${colors.module-bg}
content-foreground = ${colors.primary}
click-left = rofi -show drun

[module/file]
type = custom/text
content = " 󰉋 "
content-background = ${colors.module-bg}
content-foreground = ${colors.secondary}
click-right = dolphin $HOME

[module/screen]
type = custom/text
content = "  "
content-background = ${colors.module-bg}
content-foreground = ${colors.accent}
click-left = xterm -e bash .config/bspwm/screen.sh

[module/bspwm]
type = internal/bspwm

; The active/focused workspace
label-focused = ""
label-focused-background = ${colors.module-bg}
label-focused-foreground = ${colors.primary}
label-focused-padding = 1

; Workspaces that contain open windows
label-occupied = ""
label-occupied-background = ${colors.module-bg}
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

; Workspaces with urgent activity
label-urgent = ""
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1

; Inactive / empty workspaces
label-empty = ""
label-empty-background = ${colors.module-bg}
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-background = ${colors.module-bg}
label-volume = " 󰓃 %percentage%% "
label-volume-foreground = ${colors.primary}
label-muted = " 󰓄 Mute "
label-muted-background = ${colors.module-bg}
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-background = ${colors.module-bg}
format-prefix = " 󰘚 "
format-prefix-foreground = ${colors.secondary}
label = "%percentage_used%% "

[module/cpu]
type = internal/cpu
interval = 2
format-background = ${colors.module-bg}
format-prefix = "  "
format-prefix-foreground = ${colors.accent}
label = "%percentage%% "

[module/eth]
type = custom/script
exec = ip -4 route get 1.1.1.1 2>/dev/null | awk '{print $7} END {if (!NR) print "NO WIFI"}'
interval = 3.0
format-background = ${colors.module-bg}
format-prefix = " 󰌪 "
format-prefix-foreground = ${colors.primary}
label = "%output% "

[module/date]
type = internal/date
interval = 1
date = "%H:%M:%S"
format-background = ${colors.module-bg}
format-prefix = " 󰥔 "
format-prefix-foreground = ${colors.secondary}
label = "%date% "

[module/battery]
type = internal/battery
full-at = 99
battery = BAT0
adapter = AC

format-charging = <animation-charging> <label-charging>
format-charging-background = ${colors.module-bg}

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.module-bg}

; Added format-full configuration to handle 100% state
format-full = <ramp-capacity> <label-full>
format-full-background = ${colors.module-bg}

label-charging = "%percentage%% "
label-discharging = "%percentage%% "
label-full = "%percentage%% "

ramp-capacity-0 = "󰁺"
ramp-capacity-1 = "󰁽"
ramp-capacity-2 = "󰁿"
ramp-capacity-3 = "󰂁"
ramp-capacity-4 = "󰁹"
ramp-capacity-foreground = ${colors.accent}

animation-charging-0 = "󰂄"
animation-charging-foreground = ${colors.accent}

[module/powermenu]
type = custom/text
content = " 󰍃 "
content-background = ${colors.module-bg}
content-foreground = ${colors.alert}
click-left = bash .config/bspwm/log.sh

[module/cale]
type = internal/date
interval = 60

date = "%A, %d %B %Y"
date-alt = "%d/%m/%Y"

format = <label>
format-background = ${colors.module-bg}
format-prefix = "󰈸 "
format-prefix-foreground = ${colors.secondary}

label = "%date%"
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
